<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>简单聊天 Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .msg {
      margin-bottom: 12px;
    }

    .user {
      text-align: right;
      color: #1976d2;
    }

    .ai {
      text-align: left;
      color: #333;
    }

    #input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    #input {
      flex: 1;
      resize: none;
      padding: 8px;
      font-size: 16px;
    }

    #send {
      margin-left: 8px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="2" placeholder="输入消息..."></textarea>
      <button id="send">发送</button>
    </div>
  </div>
  <script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + sender;
      msg.textContent = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msg;
    }

    sendBtn.onclick = async function () {
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      // 显示 AI 回复占位
      const aiMsg = appendMessage('', 'ai');

      // 发送 POST 请求并处理 SSE
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        if (!resp.body) throw new Error('No response body');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let aiText = '';

        // 循环读取服务端推送的数据
        while (true) {
          // 读取下一块数据
          const { value, done } = await reader.read();
          if (done) break;
          // 解码为字符串
          const chunk = decoder.decode(value, { stream: true });
          // 处理 SSE 格式
          chunk.split('\n\n').forEach(line => {
            if (line.startsWith('data: ')) {
              // 去掉 "data: " 前缀，累加到 aiText
              aiText += JSON.parse(line.slice(6)).content;
              aiMsg.textContent = aiText;
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
          });
        }
      } catch (e) {
        aiMsg.textContent = '[AI 回复失败]';
      }
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    };

    // 支持回车发送
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>
</body>

</html>
